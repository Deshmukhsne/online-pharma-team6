spring.application.name=pharma
# application.properties
spring.datasource.url=jdbc:mysql://localhost:3306/pharma
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# Update these lines to match your exact upload path
spring.web.resources.static-locations=file:C:/Users/sneha/Downloads/pharma/uploads/
spring.mvc.static-path-pattern=/images/**


# Enable debug logging to troubleshoot
logging.level.org.springframework.web=DEBUG
# Increase size limits


# Add timeout settings
server.connection-timeout=60000